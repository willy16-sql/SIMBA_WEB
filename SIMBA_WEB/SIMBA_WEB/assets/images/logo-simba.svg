<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="volcanoGrad" x1="50" y1="20" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="60%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="magmaLava" x1="50" y1="15" x2="50" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="40%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Mountain Silhouette Base -->
  <path d="M50 25 L88 88 H12 Z" fill="url(#volcanoGrad)"/>
  
  <!-- Secondary Mountain Peak behind -->
  <path d="M72 45 L95 88 H60 Z" fill="#27272A" opacity="0.6"/>
  <path d="M28 50 L5 88 H40 Z" fill="#27272A" opacity="0.6"/>

  <!-- Crater Magma Core (Glowing) -->
  <ellipse cx="50" cy="25" rx="14" ry="4" fill="#FF3D00" filter="url(#glow)"/>
  <ellipse cx="50" cy="25" rx="9" ry="2.5" fill="#FFE082"/>

  <!-- Lava Flow Stream -->
  <path d="M47 26 Q43 45 48 55 Q52 65 50 78" stroke="url(#magmaLava)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <path d="M53 26 Q57 40 54 48" stroke="#FFAB00" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Eruption Sparks -->
  <circle cx="50" cy="14" r="2" fill="#FFE082"/>
  <circle cx="43" cy="10" r="1.5" fill="#FF9800"/>
  <circle cx="58" cy="9" r="1.8" fill="#FF5722"/>
  <circle cx="52" cy="5" r="1.2" fill="#FFF3E0"/>
</svg>
