<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="halmaheraSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0E18"/>
      <stop offset="50%" stop-color="#1C1826"/>
      <stop offset="100%" stop-color="#2D1B24"/>
    </linearGradient>
    <linearGradient id="ibuMtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#302636"/>
      <stop offset="100%" stop-color="#110E16"/>
    </linearGradient>
    <linearGradient id="dukonoMtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2230"/>
      <stop offset="100%" stop-color="#0D0B12"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#halmaheraSky)"/>

  <!-- Left: Gunung Ibu Ash Plume Column -->
  <path d="M280,240 Q240,170 200,120 Q180,60 250,30 Q330,10 360,60 Q380,120 340,180 Q310,210 290,240 Z" fill="#4B4254" opacity="0.9"/>
  <circle cx="240" cy="80" r="50" fill="#584C62" opacity="0.8"/>
  <circle cx="320" cy="65" r="55" fill="#655770" opacity="0.85"/>

  <!-- Right: Gunung Dukono Eruption Plume -->
  <path d="M580,260 Q540,200 520,150 Q500,100 560,70 Q620,50 650,90 Q670,140 640,200 Q610,230 590,260 Z" fill="#3D3745" opacity="0.85"/>
  <circle cx="560" cy="110" r="45" fill="#494152" opacity="0.8"/>
  <circle cx="620" cy="95" r="45" fill="#544B5E" opacity="0.8"/>

  <!-- Mount Ibu Body (Left) -->
  <polygon points="50,500 270,240 310,240 500,500" fill="url(#ibuMtn)"/>
  
  <!-- Mount Dukono Body (Right) -->
  <polygon points="380,500 570,260 610,260 780,500" fill="url(#dukonoMtn)"/>

  <!-- Respirator / Mask Mitigasi Icon Overlay (Symbol of Disaster Response) -->
  <g transform="translate(640, 390) scale(0.9)">
    <rect x="0" y="0" width="130" height="80" rx="14" fill="#181B24" stroke="#FF5722" stroke-width="1.5" opacity="0.9"/>
    <!-- Medical Mask Silhouette -->
    <path d="M25,35 Q65,15 105,35 Q115,65 65,70 Q15,65 25,35 Z" fill="#37474F" stroke="#90A4AE" stroke-width="2"/>
    <line x1="25" y1="35" x2="15" y2="28" stroke="#90A4AE" stroke-width="1.5"/>
    <line x1="25" y1="55" x2="15" y2="60" stroke="#90A4AE" stroke-width="1.5"/>
    <line x1="105" y1="35" x2="115" y2="28" stroke="#90A4AE" stroke-width="1.5"/>
    <line x1="105" y1="55" x2="115" y2="60" stroke="#90A4AE" stroke-width="1.5"/>
    <text x="65" y="50" fill="#FFF" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BPBD MASK</text>
  </g>

  <!-- Foreground Halmahera Island -->
  <polygon points="0,500 0,460 200,450 450,465 800,450 800,500" fill="#08080C"/>

  <!-- Badge -->
  <rect x="25" y="25" width="220" height="34" rx="8" fill="#F97316" opacity="0.95"/>
  <text x="35" y="47" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="13" letter-spacing="1">SIAGA (LEVEL III) • 2026</text>
</svg>
