<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="marapiSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="60%" stop-color="#1B171E"/>
      <stop offset="100%" stop-color="#361D1A"/>
    </linearGradient>
    <linearGradient id="marapiMtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#332B38"/>
      <stop offset="50%" stop-color="#1C1824"/>
      <stop offset="100%" stop-color="#0E0C14"/>
    </linearGradient>
    <linearGradient id="laharRiver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="50%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#271C19"/>
    </linearGradient>
    <filter id="mGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#marapiSky)"/>

  <!-- Marapi Ash Column Plume -->
  <path d="M410,210 Q350,140 310,90 Q290,40 370,15 Q450,-10 510,35 Q550,80 500,150 Q460,190 430,210 Z" fill="#3E3842" opacity="0.9"/>
  <circle cx="360" cy="70" r="60" fill="#4A4250" opacity="0.8"/>
  <circle cx="460" cy="55" r="70" fill="#584C5E" opacity="0.85"/>
  <circle cx="410" cy="120" r="50" fill="#382E3C" opacity="0.8"/>

  <!-- Distant Bukit Barisan Ridges -->
  <polygon points="0,500 0,330 150,290 320,330 450,300 640,340 800,310 800,500" fill="#131520"/>

  <!-- Mount Marapi Complex -->
  <polygon points="140,500 370,210 440,210 700,500" fill="url(#marapiMtn)"/>
  
  <!-- Verbeek Crater Brim -->
  <ellipse cx="405" cy="210" rx="38" ry="12" fill="#E65100" filter="url(#mGlow)"/>
  <ellipse cx="405" cy="210" rx="30" ry="8" fill="#FFB74D"/>

  <!-- Lahar River / Batang Anai Valley (Galodo Riverbed) -->
  <path d="M420,340 Q390,390 320,420 Q240,450 160,500 L260,500 Q360,460 420,430 Q470,390 420,340 Z" fill="url(#laharRiver)"/>
  <path d="M410,360 Q380,400 310,430 Q230,460 180,500" stroke="#795548" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Excavator / Heavy Machinery Silhouette for River Dredging -->
  <g transform="translate(290, 415) scale(0.65)">
    <!-- Body -->
    <rect x="0" y="20" width="50" height="30" rx="4" fill="#FFA000"/>
    <rect x="10" y="5" width="25" height="18" rx="2" fill="#37474F"/>
    <!-- Tracks -->
    <rect x="-5" y="48" width="60" height="15" rx="7" fill="#212121"/>
    <!-- Boom Arm & Bucket -->
    <line x1="45" y1="25" x2="80" y2="0" stroke="#FFA000" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="0" x2="105" y2="35" stroke="#FFA000" stroke-width="5" stroke-linecap="round"/>
    <path d="M105,35 L120,45 L115,55 L100,45 Z" fill="#424242"/>
  </g>

  <!-- Foreground Plains -->
  <path d="M0,500 L0,460 Q300,440 500,455 Q700,440 800,460 L800,500 Z" fill="#0A0B10"/>

  <!-- Badge -->
  <rect x="25" y="25" width="220" height="34" rx="8" fill="#F97316" opacity="0.95"/>
  <text x="35" y="47" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="13" letter-spacing="1">SIAGA (LEVEL III) • 2026</text>
</svg>
