<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sitaroSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#141928"/>
      <stop offset="100%" stop-color="#221C26"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2238"/>
      <stop offset="100%" stop-color="#06101E"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sitaroSky)"/>

  <!-- Stars -->
  <circle cx="150" cy="50" r="1.5" fill="#FFF" opacity="0.8"/>
  <circle cx="650" cy="60" r="1.3" fill="#FFF" opacity="0.7"/>

  <!-- Distant Tagulandang Island Contour -->
  <polygon points="400,500 550,290 620,290 800,420 800,500" fill="#121622"/>

  <!-- Sea Water (Laut Sulawesi & Sitaro) -->
  <rect x="0" y="380" width="800" height="120" fill="url(#seaGrad)"/>
  <path d="M0,390 Q200,380 400,390 Q600,400 800,388" stroke="#1E88E5" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M0,420 Q200,410 400,420 Q600,430 800,418" stroke="#1E88E5" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Mount Ruang Island Volcano in the Middle of Sea -->
  <polygon points="120,410 310,210 350,210 520,410" fill="#2D222A"/>
  <!-- Ruang Crater Caldera Silhouette -->
  <ellipse cx="330" cy="210" rx="28" ry="10" fill="#4E342E"/>
  <ellipse cx="330" cy="210" rx="18" ry="6" fill="#FF5722" opacity="0.8"/>

  <!-- Tsunami Early Warning Sensor Buoy in the Ocean -->
  <g transform="translate(180, 395) scale(0.8)">
    <circle cx="20" cy="20" r="14" fill="#FFB300"/>
    <line x1="20" y1="6" x2="20" y2="-15" stroke="#FFA000" stroke-width="2.5"/>
    <circle cx="20" cy="-16" r="3" fill="#00E676"/>
    <path d="M12,25 Q20,32 28,25" stroke="#E65100" stroke-width="2" fill="none"/>
  </g>

  <!-- Relocation Permanent Housing (Huntap BNPB) Silhouette on Tagulandang Coast -->
  <g transform="translate(560, 370) scale(0.85)">
    <!-- House 1 -->
    <rect x="0" y="20" width="40" height="30" fill="#37474F"/>
    <polygon points="-5,20 20,0 45,20" fill="#FF5722"/>
    <rect x="15" y="32" width="10" height="18" fill="#ECEFF1"/>
    <!-- House 2 -->
    <rect x="55" y="20" width="40" height="30" fill="#37474F"/>
    <polygon points="50,20 75,0 100,20" fill="#FF5722"/>
    <rect x="70" y="32" width="10" height="18" fill="#ECEFF1"/>
    <!-- House 3 -->
    <rect x="110" y="20" width="40" height="30" fill="#37474F"/>
    <polygon points="105,20 130,0 155,20" fill="#FF5722"/>
    <rect x="125" y="32" width="10" height="18" fill="#ECEFF1"/>
    <!-- Ground / Paved Area -->
    <rect x="-20" y="50" width="200" height="12" fill="#263238"/>
  </g>

  <!-- Badge -->
  <rect x="25" y="25" width="220" height="34" rx="8" fill="#F97316" opacity="0.95"/>
  <text x="35" y="47" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="13" letter-spacing="1">SIAGA (LEVEL III) • 2026</text>
</svg>
