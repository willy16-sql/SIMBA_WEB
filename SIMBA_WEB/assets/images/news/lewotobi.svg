<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="60%" stop-color="#1A0A0E"/>
      <stop offset="100%" stop-color="#381014"/>
    </linearGradient>
    <linearGradient id="ashGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#42252B"/>
      <stop offset="70%" stop-color="#262730"/>
      <stop offset="100%" stop-color="#14161B"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D191D"/>
      <stop offset="40%" stop-color="#1B1C24"/>
      <stop offset="100%" stop-color="#0C0D12"/>
    </linearGradient>
    <radialGradient id="craterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFD54F"/>
      <stop offset="60%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <circle cx="120" cy="60" r="1.5" fill="#FFF" opacity="0.7"/>
  <circle cx="280" cy="40" r="1.2" fill="#FFF" opacity="0.6"/>
  <circle cx="680" cy="80" r="1.8" fill="#FFF" opacity="0.8"/>
  <circle cx="730" cy="140" r="1" fill="#FFF" opacity="0.5"/>
  <circle cx="90" cy="160" r="1.2" fill="#FFF" opacity="0.6"/>

  <!-- Giant Ash Plume Column -->
  <path d="M400,240 Q360,180 320,130 Q280,70 340,30 Q410,-10 470,20 Q540,60 500,120 Q460,180 430,240 Z" fill="url(#ashGrad)" opacity="0.95"/>
  <circle cx="340" cy="90" r="65" fill="#2D2832" opacity="0.75"/>
  <circle cx="450" cy="70" r="85" fill="#3D2930" opacity="0.8"/>
  <circle cx="400" cy="40" r="75" fill="#242129" opacity="0.85"/>
  <circle cx="380" cy="140" r="55" fill="#4A2626" opacity="0.7"/>

  <!-- Volcanic Lightning Bolts -->
  <path d="M370,110 L355,145 L375,155 L350,200" stroke="#FFF7C2" stroke-width="2.5" fill="none" filter="url(#glow)"/>
  <path d="M440,80 L425,120 L445,130 L430,175" stroke="#FFE082" stroke-width="2" fill="none" filter="url(#glow)"/>

  <!-- Distant Mountains -->
  <polygon points="0,500 0,360 180,310 320,350 480,320 650,370 800,330 800,500" fill="#10121A"/>

  <!-- Lewotobi Stratovolcano Body -->
  <polygon points="120,500 370,240 430,240 680,500" fill="url(#mountainGrad)"/>

  <!-- Mountain Ridges & Lighting -->
  <path d="M370,240 Q300,340 180,500" stroke="#FF7043" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M430,240 Q500,340 620,500" stroke="#FF7043" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Lava Fissures / Streams -->
  <path d="M390,245 Q375,290 360,330 Q340,380 310,430 Q280,470 250,500" stroke="#FF5722" stroke-width="4.5" fill="none" filter="url(#glow)"/>
  <path d="M390,245 Q375,290 360,330 Q340,380 310,430 Q280,470 250,500" stroke="#FFEE58" stroke-width="2" fill="none"/>
  
  <path d="M410,245 Q425,290 435,340 Q450,400 480,470" stroke="#FF5722" stroke-width="3.5" fill="none" filter="url(#glow)"/>
  <path d="M410,245 Q425,290 435,340 Q450,400 480,470" stroke="#FFCA28" stroke-width="1.5" fill="none"/>

  <!-- Glowing Crater Summit -->
  <ellipse cx="400" cy="240" rx="45" ry="15" fill="url(#craterGlow)"/>
  <ellipse cx="400" cy="240" rx="35" ry="10" fill="#FFF" filter="url(#glow)"/>

  <!-- Ballistic Bombs (Lontaran Batu Pijar) -->
  <circle cx="310" cy="180" r="4.5" fill="#FFEB3B" filter="url(#glow)"/>
  <path d="M390,240 Q340,190 310,180" stroke="#FF5722" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  
  <circle cx="490" cy="160" r="5.5" fill="#FFEB3B" filter="url(#glow)"/>
  <path d="M410,240 Q460,180 490,160" stroke="#FF5722" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>

  <circle cx="530" cy="220" r="4" fill="#FF9800" filter="url(#glow)"/>

  <!-- Foreground Plains & Evacuation Area -->
  <path d="M0,500 L0,470 Q200,450 400,465 Q600,450 800,470 L800,500 Z" fill="#08090D"/>

  <!-- Overlay Badge -->
  <rect x="25" y="25" width="230" height="34" rx="8" fill="#DC2626" opacity="0.95"/>
  <text x="35" y="47" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="13" letter-spacing="1">AWAS (LEVEL IV) • 2026</text>
</svg>
